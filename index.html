<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nounou Manager</title>
<meta name="theme-color" content="#3D6B7A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5F1;
    --ink:#2A3B42;
    --ink-soft:#5C6B70;
    --primary:#3D6B7A;
    --primary-dark:#2A4D58;
    --accent:#D9A441;
    --card:#FFFFFF;
    --border:#E4E0D8;
    --danger:#B5504B;
    --success:#4C7A5E;
    --absence:#8A6A1F;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;
    line-height:1.4;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
    padding-top:env(safe-area-inset-top);
    min-height:100vh;
  }
  h1,h2,h3{font-family:'Quicksand',-apple-system,sans-serif;font-weight:700;margin:0 0 4px;}
  header.top{
    padding:18px 20px 14px;
    background:var(--primary);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  header.top h1{font-size:1.25rem;color:#fff;margin:0;}
  header.top .sub{font-size:0.78rem;color:#DCEAEE;margin-top:2px;}
  main{padding:16px;max-width:640px;margin:0 auto;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{font-size:1.05rem;color:var(--primary-dark);}
  label{
    display:block;
    font-size:0.82rem;
    color:var(--ink-soft);
    margin:10px 0 4px;
    font-weight:600;
  }
  input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],input[type=email],input[type=month],textarea,select{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:1rem;
    background:#FCFBF9;
    color:var(--ink);
    font-family:inherit;
  }
  input:focus,textarea:focus,select:focus{
    outline:2px solid var(--primary);
    outline-offset:1px;
  }
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  button{
    font-family:inherit;
    font-size:0.95rem;
    font-weight:600;
    border:none;
    border-radius:10px;
    padding:11px 16px;
    cursor:pointer;
  }
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:active{background:var(--primary-dark);}
  .btn-accent{background:var(--accent);color:var(--ink);}
  .btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary);}
  .btn-danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger);}
  .btn-ghost{background:transparent;color:var(--ink-soft);padding:8px 10px;}
  .btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .fiche-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 4px;
    border-bottom:1px solid var(--border);
  }
  .fiche-item:last-child{border-bottom:none;}
  .dot{
    width:14px;height:14px;border-radius:50%;flex-shrink:0;
  }
  .fiche-info{flex:1;min-width:0;}
  .fiche-info .name{font-weight:700;}
  .fiche-info .meta{font-size:0.8rem;color:var(--ink-soft);}
  .icon-btn{
    background:transparent;border:none;color:var(--ink-soft);
    font-size:1.1rem;padding:6px;
  }
  .heure-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 4px;border-bottom:1px solid var(--border);
    font-size:0.92rem;
  }
  .heure-item:last-child{border-bottom:none;}
  .heure-item .dur{color:var(--primary-dark);font-weight:700;white-space:nowrap;}
  .heure-item.is-absence .dur{color:var(--absence);}
  .heure-item .comment{display:block;font-size:0.78rem;font-style:italic;color:var(--ink-soft);margin-top:2px;}
  .empty{
    text-align:center;color:var(--ink-soft);padding:24px 10px;font-size:0.92rem;
  }
  .total-line{
    display:flex;justify-content:space-between;padding:6px 0;font-size:0.95rem;
  }
  .total-line.grand{
    border-top:2px solid var(--border);margin-top:8px;padding-top:12px;
    font-weight:700;font-size:1.1rem;color:var(--primary-dark);
  }
  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--card);
    border-top:1px solid var(--border);
    display:flex;
    padding-bottom:env(safe-area-inset-bottom);
    z-index:10;
  }
  nav.tabs button{
    flex:1;background:none;border:none;border-radius:0;
    padding:10px 4px 8px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--ink-soft);font-size:0.7rem;font-weight:600;
  }
  nav.tabs button.active{color:var(--primary);}
  nav.tabs button svg{width:22px;height:22px;}
  .toast{
    position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;
    transform:translateX(-50%);
    background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:20px;font-size:0.88rem;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;
  }
  .toast.show{opacity:1;}
  .badge{
    display:inline-block;background:#EFE6D0;color:#8A6A1F;
    font-size:0.72rem;font-weight:700;padding:2px 8px;border-radius:8px;
  }
  select.fiche-select{margin-bottom:14px;}
  .hint{font-size:0.78rem;color:var(--ink-soft);margin-top:4px;}
  a.link-btn{color:var(--primary);font-weight:600;text-decoration:none;}
  .segmented{display:flex;border:1.5px solid var(--primary);border-radius:10px;overflow:hidden;margin-top:6px;}
  .segmented button{flex:1;border-radius:0;background:#fff;color:var(--primary);padding:9px;}
  .segmented button.active{background:var(--primary);color:#fff;}
  .checkline{display:flex;align-items:center;gap:8px;margin-top:10px;}
  .checkline input{width:auto;}
  .checkline label{margin:0;}
  .child-summary{border-bottom:1px solid var(--border);padding:12px 0;}
  .child-summary:last-child{border-bottom:none;}
  .child-summary .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .child-summary .head .nm{font-weight:700;color:var(--primary-dark);}
  .child-summary .head .tt{font-weight:700;}
  .child-summary .sub{font-size:0.82rem;color:var(--ink-soft);}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Nounou Manager</h1>
    <div class="sub" id="headerSub">Gestion simple des heures et du salaire</div>
  </div>
</header>

<main id="app"></main>

<div class="toast" id="toast"></div>

<nav class="tabs">
  <button data-tab="fiches" class="tab-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg>
    Fiches
  </button>
  <button data-tab="heures" class="tab-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    Journées
  </button>
  <button data-tab="estimation" class="tab-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
    Estimation
  </button>
  <button data-tab="sauvegarde" class="tab-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
    Sauvegarde
  </button>
</nav>

<script>
(function(){
  "use strict";

  const STORAGE_FICHES = "nounou_fiches_v2";
  const STORAGE_HEURES = "nounou_heures_v2";
  const STORAGE_ABSENCES = "nounou_absences_v2";
  const COLORS = ["#3D6B7A","#D9A441","#B5504B","#4C7A5E","#7A5C8A","#C97B5A"];
  const TYPES_ABSENCE = ["Congé payé","Maladie","Congé sans solde","Jour férié","Autre"];

  function loadJSON(key){ try { return JSON.parse(localStorage.getItem(key)) || []; } catch(e){ return []; } }
  function saveJSON(key, list){ localStorage.setItem(key, JSON.stringify(list)); }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function money(n){ return (Math.round(n*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + " €"; }
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(()=>t.classList.remove('show'), 2200);
  }
  function timeToMinutes(t){
    if(!t) return null;
    const parts = t.split(':').map(Number);
    return parts[0]*60+parts[1];
  }
  function computeDurationHours(debut, fin){
    let d = timeToMinutes(debut), f = timeToMinutes(fin);
    if(d===null||f===null) return 0;
    let diff = f - d;
    if(diff < 0) diff += 24*60;
    return diff/60;
  }
  function monthLabel(ym){
    const parts = ym.split('-');
    const noms = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
    return noms[parseInt(parts[1],10)-1] + " " + parts[0];
  }
  function currentYm(){
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0');
  }
  function fmtDate(d){
    return new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit'});
  }

  let state = {
    tab: 'fiches',
    fiches: loadJSON(STORAGE_FICHES),
    heures: loadJSON(STORAGE_HEURES),
    absences: loadJSON(STORAGE_ABSENCES),
    selectedFicheId: null,
    editingFicheId: null,
    heuresMonth: currentYm(),
    estimMonth: currentYm(),
    journeeType: 'travail', // 'travail' ou 'absence'
  };

  if(state.fiches.length && !state.selectedFicheId){
    state.selectedFicheId = state.fiches[0].id;
  }

  const app = document.getElementById('app');
  const headerSub = document.getElementById('headerSub');

  function setTab(tab){
    state.tab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
    render();
  }
  document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', ()=>setTab(b.dataset.tab)));

  function render(){
    if(state.tab==='fiches') return renderFiches();
    if(state.tab==='heures') return renderHeures();
    if(state.tab==='estimation') return renderEstimation();
    if(state.tab==='sauvegarde') return renderSauvegarde();
  }

  // ---------- FICHES ----------
  function renderFiches(){
    headerSub.textContent = "Fiches enfants / contrats";
    const editing = state.fiches.find(f => f.id === state.editingFicheId);
    app.innerHTML = `
      <div class="card">
        <h2>${editing ? "Modifier la fiche" : "Nouvelle fiche"}</h2>
        <div class="row">
          <div>
            <label for="f-prenom">Prénom de l'enfant</label>
            <input type="text" id="f-prenom" value="${editing ? escapeHtml(editing.prenom) : ''}" placeholder="Léo">
          </div>
          <div>
            <label for="f-nomEnfant">Nom de l'enfant</label>
            <input type="text" id="f-nomEnfant" value="${editing ? escapeHtml(editing.nomEnfant||'') : ''}" placeholder="Dupont">
          </div>
        </div>
        <label for="f-naissance">Date de naissance</label>
        <input type="date" id="f-naissance" value="${editing ? (editing.dateNaissance||'') : ''}">
        <label for="f-famille">Famille employeuse</label>
        <input type="text" id="f-famille" value="${editing ? escapeHtml(editing.famille) : ''}" placeholder="Famille Martin">
        <div class="row">
          <div>
            <label for="f-tel">Téléphone parent</label>
            <input type="tel" id="f-tel" value="${editing ? escapeHtml(editing.telephoneParent||'') : ''}" placeholder="06 12 34 56 78">
          </div>
          <div>
            <label for="f-email">Email parent</label>
            <input type="email" id="f-email" value="${editing ? escapeHtml(editing.emailParent||'') : ''}" placeholder="parent@mail.com">
          </div>
        </div>
        <div class="row">
          <div>
            <label for="f-taux">Taux horaire net (€)</label>
            <input type="number" step="0.01" min="0" id="f-taux" value="${editing ? editing.taux : ''}" placeholder="4.50">
          </div>
          <div>
            <label for="f-entretien">Indemnité entretien / jour (€)</label>
            <input type="number" step="0.01" min="0" id="f-entretien" value="${editing ? editing.entretien : ''}" placeholder="3.50">
          </div>
        </div>
        <label for="f-repas">Frais de repas / jour (€)</label>
        <input type="number" step="0.01" min="0" id="f-repas" value="${editing ? editing.repas : ''}" placeholder="4.00">
        <p class="hint">Les montants sont modifiables à tout moment, notamment lors d'une revalorisation légale annuelle.</p>
        <div class="btn-row">
          <button class="btn-primary" id="f-save">${editing ? "Enregistrer" : "Ajouter la fiche"}</button>
          ${editing ? '<button class="btn-ghost" id="f-cancel">Annuler</button>' : ''}
        </div>
      </div>
      <div class="card">
        <h2>Fiches existantes</h2>
        <div id="fiches-list">
          ${state.fiches.length ? state.fiches.map((f,i) => `
            <div class="fiche-item">
              <div class="dot" style="background:${COLORS[i % COLORS.length]}"></div>
              <div class="fiche-info">
                <div class="name">${escapeHtml(f.prenom)} ${escapeHtml(f.nomEnfant||'')}</div>
                <div class="meta">${escapeHtml(f.famille)} · ${f.taux} €/h</div>
              </div>
              <button class="icon-btn" data-edit="${f.id}" aria-label="Modifier">✎</button>
              <button class="icon-btn" data-del="${f.id}" aria-label="Supprimer">🗑</button>
            </div>
          `).join('') : "<div class=\"empty\">Aucune fiche pour l'instant. Ajoute la première ci-dessus.</div>"}
        </div>
      </div>
    `;
    document.getElementById('f-save').addEventListener('click', onSaveFiche);
    const cancelBtn = document.getElementById('f-cancel');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ state.editingFicheId=null; renderFiches(); });
    document.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', ()=>{
      state.editingFicheId = b.dataset.edit; renderFiches();
    }));
    document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', ()=>{
      if(confirm("Supprimer cette fiche et toutes ses journées saisies ?")){
        const id = b.dataset.del;
        state.fiches = state.fiches.filter(f=>f.id!==id);
        state.heures = state.heures.filter(h=>h.ficheId!==id);
        state.absences = state.absences.filter(a=>a.ficheId!==id);
        saveJSON(STORAGE_FICHES, state.fiches);
        saveJSON(STORAGE_HEURES, state.heures);
        saveJSON(STORAGE_ABSENCES, state.absences);
        if(state.selectedFicheId===id) state.selectedFicheId = state.fiches[0]?.id || null;
        toast("Fiche supprimée");
        renderFiches();
      }
    }));
  }

  function onSaveFiche(){
    const prenom = document.getElementById('f-prenom').value.trim();
    const nomEnfant = document.getElementById('f-nomEnfant').value.trim();
    const dateNaissance = document.getElementById('f-naissance').value;
    const famille = document.getElementById('f-famille').value.trim();
    const telephoneParent = document.getElementById('f-tel').value.trim();
    const emailParent = document.getElementById('f-email').value.trim();
    const taux = parseFloat(document.getElementById('f-taux').value);
    const entretien = parseFloat(document.getElementById('f-entretien').value) || 0;
    const repas = parseFloat(document.getElementById('f-repas').value) || 0;
    if(!prenom){ toast("Le prénom est obligatoire"); return; }
    if(isNaN(taux) || taux <= 0){ toast("Indique un taux horaire valide"); return; }
    const payload = {prenom, nomEnfant, dateNaissance, famille, telephoneParent, emailParent, taux, entretien, repas};
    if(state.editingFicheId){
      const f = state.fiches.find(x=>x.id===state.editingFicheId);
      Object.assign(f, payload);
      state.editingFicheId = null;
      toast("Fiche mise à jour");
    } else {
      const f = Object.assign({id: uid()}, payload);
      state.fiches.push(f);
      state.selectedFicheId = f.id;
      toast("Fiche ajoutée");
    }
    saveJSON(STORAGE_FICHES, state.fiches);
    renderFiches();
  }

  // ---------- HEURES / JOURNEES (travail + absences) ----------
  function renderHeures(){
    headerSub.textContent = "Journées travaillées et absences";
    if(!state.fiches.length){
      app.innerHTML = "<div class=\"card\"><div class=\"empty\">Crée d'abord une fiche dans l'onglet Fiches.</div></div>";
      return;
    }
    if(!state.selectedFicheId) state.selectedFicheId = state.fiches[0].id;

    const heuresEntries = state.heures.filter(h => h.ficheId===state.selectedFicheId && h.date.startsWith(state.heuresMonth))
      .map(h => Object.assign({_kind:'travail'}, h));
    const absEntries = state.absences.filter(a => a.ficheId===state.selectedFicheId && a.date.startsWith(state.heuresMonth))
      .map(a => Object.assign({_kind:'absence'}, a));
    const all = heuresEntries.concat(absEntries).sort((a,b)=>a.date.localeCompare(b.date));

    const isTravail = state.journeeType === 'travail';

    app.innerHTML = `
      <div class="card">
        <label for="h-fiche">Enfant</label>
        <select id="h-fiche" class="fiche-select">
          ${state.fiches.map(f=>`<option value="${f.id}" ${f.id===state.selectedFicheId?'selected':''}>${escapeHtml(f.prenom)}</option>`).join('')}
        </select>
        <h2>Ajouter une journée</h2>
        <div class="segmented">
          <button type="button" data-jt="travail" class="${isTravail?'active':''}">Travaillée</button>
          <button type="button" data-jt="absence" class="${!isTravail?'active':''}">Absence</button>
        </div>
        <label for="h-date">Date</label>
        <input type="date" id="h-date" value="${new Date().toISOString().slice(0,10)}">
        ${isTravail ? `
          <div class="row">
            <div>
              <label for="h-debut">Heure début</label>
              <input type="time" id="h-debut" value="08:00">
            </div>
            <div>
              <label for="h-fin">Heure fin</label>
              <input type="time" id="h-fin" value="18:00">
            </div>
          </div>
          <label for="h-comment">Commentaire (optionnel)</label>
          <input type="text" id="h-comment" placeholder="Ex : sortie plus tôt">
        ` : `
          <label for="h-type">Type d'absence</label>
          <select id="h-type">
            ${TYPES_ABSENCE.map(t=>`<option value="${t}">${t}</option>`).join('')}
          </select>
          <div class="checkline">
            <input type="checkbox" id="h-payee">
            <label for="h-payee">Journée payée quand même</label>
          </div>
          <div id="h-montant-wrap" style="display:none;">
            <label for="h-montant">Montant à inclure dans l'estimation (€)</label>
            <input type="number" step="0.01" min="0" id="h-montant" value="0">
          </div>
          <label for="h-comment">Commentaire (optionnel)</label>
          <input type="text" id="h-comment" placeholder="Ex : arrêt maladie 3 jours">
        `}
        <div class="btn-row">
          <button class="btn-primary" id="h-save">Ajouter</button>
        </div>
      </div>
      <div class="card">
        <label for="h-month">Mois affiché</label>
        <input type="month" id="h-month" value="${state.heuresMonth}">
        <div style="margin-top:10px;">
          ${all.length ? all.map(e => {
            if(e._kind==='travail'){
              return `
                <div class="heure-item">
                  <div>${fmtDate(e.date)} — ${e.debut} → ${e.fin}
                    ${e.commentaire ? `<span class="comment">${escapeHtml(e.commentaire)}</span>` : ''}
                  </div>
                  <div class="dur">${computeDurationHours(e.debut,e.fin).toFixed(2)} h
                    <button class="icon-btn" data-delh="${e.id}" aria-label="Supprimer">🗑</button>
                  </div>
                </div>`;
            } else {
              return `
                <div class="heure-item is-absence">
                  <div>${fmtDate(e.date)} — ${escapeHtml(e.type)}
                    ${e.commentaire ? `<span class="comment">${escapeHtml(e.commentaire)}</span>` : ''}
                  </div>
                  <div class="dur">${e.payee ? money(e.montant||0) : 'non payée'}
                    <button class="icon-btn" data-dela="${e.id}" aria-label="Supprimer">🗑</button>
                  </div>
                </div>`;
            }
          }).join('') : '<div class="empty">Aucune journée saisie ce mois-ci pour cet enfant.</div>'}
        </div>
      </div>
    `;
    document.getElementById('h-fiche').addEventListener('change', (e)=>{ state.selectedFicheId = e.target.value; renderHeures(); });
    document.getElementById('h-month').addEventListener('change', (e)=>{ state.heuresMonth = e.target.value; renderHeures(); });
    document.getElementById('h-save').addEventListener('click', onSaveJournee);
    document.querySelectorAll('[data-jt]').forEach(b => b.addEventListener('click', ()=>{
      state.journeeType = b.dataset.jt; renderHeures();
    }));
    const payeeBox = document.getElementById('h-payee');
    if(payeeBox){
      payeeBox.addEventListener('change', ()=>{
        document.getElementById('h-montant-wrap').style.display = payeeBox.checked ? 'block' : 'none';
      });
    }
    document.querySelectorAll('[data-delh]').forEach(b=>b.addEventListener('click', ()=>{
      state.heures = state.heures.filter(h=>h.id!==b.dataset.delh);
      saveJSON(STORAGE_HEURES, state.heures);
      renderHeures();
    }));
    document.querySelectorAll('[data-dela]').forEach(b=>b.addEventListener('click', ()=>{
      state.absences = state.absences.filter(a=>a.id!==b.dataset.dela);
      saveJSON(STORAGE_ABSENCES, state.absences);
      renderHeures();
    }));
  }

  function onSaveJournee(){
    const date = document.getElementById('h-date').value;
    if(!date){ toast("La date est obligatoire"); return; }
    // une date = soit travail, soit absence : on retire l'éventuelle entrée existante de l'autre type
    state.heures = state.heures.filter(h => !(h.ficheId===state.selectedFicheId && h.date===date && state.journeeType==='absence'));
    state.absences = state.absences.filter(a => !(a.ficheId===state.selectedFicheId && a.date===date && state.journeeType==='travail'));

    if(state.journeeType === 'travail'){
      const debut = document.getElementById('h-debut').value;
      const fin = document.getElementById('h-fin').value;
      const commentaire = document.getElementById('h-comment').value.trim();
      if(!debut || !fin){ toast("Complète les heures"); return; }
      const existing = state.heures.find(h => h.ficheId===state.selectedFicheId && h.date===date);
      if(existing){
        existing.debut = debut; existing.fin = fin; existing.commentaire = commentaire;
      } else {
        state.heures.push({id: uid(), ficheId: state.selectedFicheId, date, debut, fin, commentaire});
      }
      saveJSON(STORAGE_HEURES, state.heures);
    } else {
      const type = document.getElementById('h-type').value;
      const payee = document.getElementById('h-payee').checked;
      const montant = payee ? (parseFloat(document.getElementById('h-montant').value) || 0) : 0;
      const commentaire = document.getElementById('h-comment').value.trim();
      const existing = state.absences.find(a => a.ficheId===state.selectedFicheId && a.date===date);
      if(existing){
        Object.assign(existing, {type, payee, montant, commentaire});
      } else {
        state.absences.push({id: uid(), ficheId: state.selectedFicheId, date, type, payee, montant, commentaire});
      }
      saveJSON(STORAGE_ABSENCES, state.absences);
    }
    toast("Journée enregistrée");
    renderHeures();
  }

  // ---------- ESTIMATION (vue globale tous enfants) ----------
  function computeFicheMonth(fiche, ym){
    const entries = state.heures.filter(h => h.ficheId===fiche.id && h.date.startsWith(ym));
    const absEntries = state.absences.filter(a => a.ficheId===fiche.id && a.date.startsWith(ym));
    const totalHeures = entries.reduce((s,e)=>s+computeDurationHours(e.debut,e.fin),0);
    const joursTravailles = entries.length;
    const salaire = totalHeures * fiche.taux;
    const repasTotal = joursTravailles * fiche.repas;
    const entretienTotal = joursTravailles * fiche.entretien;
    const absencesPayees = absEntries.filter(a=>a.payee).reduce((s,a)=>s+(a.montant||0),0);
    const nbAbsences = absEntries.length;
    const total = salaire + repasTotal + entretienTotal + absencesPayees;
    return {totalHeures, joursTravailles, salaire, repasTotal, entretienTotal, absencesPayees, nbAbsences, total};
  }

  function renderEstimation(){
    headerSub.textContent = "Estimation mensuelle — tous les enfants";
    if(!state.fiches.length){
      app.innerHTML = "<div class=\"card\"><div class=\"empty\">Crée d'abord une fiche dans l'onglet Fiches.</div></div>";
      return;
    }
    const calc = state.fiches.map(f => Object.assign({fiche:f}, computeFicheMonth(f, state.estimMonth)));
    const grandTotal = calc.reduce((s,c)=>s+c.total, 0);

    app.innerHTML = `
      <div class="card">
        <label for="e-month">Mois</label>
        <input type="month" id="e-month" value="${state.estimMonth}">
      </div>
      <div class="card">
        <h2><span class="badge">${monthLabel(state.estimMonth)}</span></h2>
        ${calc.map(c => `
          <div class="child-summary">
            <div class="head">
              <span class="nm">${escapeHtml(c.fiche.prenom)} ${escapeHtml(c.fiche.nomEnfant||'')}</span>
              <span class="tt">${money(c.total)}</span>
            </div>
            <div class="sub">${c.joursTravailles} j travaillés · ${c.totalHeures.toFixed(2)} h · salaire ${money(c.salaire)} · entretien ${money(c.entretienTotal)} · repas ${money(c.repasTotal)}${c.nbAbsences ? ` · ${c.nbAbsences} absence(s)${c.absencesPayees ? ' (' + money(c.absencesPayees) + ' payée)' : ''}` : ''}</div>
          </div>
        `).join('')}
        <div class="total-line grand"><span>TOTAL GLOBAL</span><span>${money(grandTotal)}</span></div>
        <div class="btn-row">
          <button class="btn-accent" id="e-share">Partager / copier le résumé global</button>
        </div>
        <p class="hint">Estimation indicative basée sur les taux et montants saisis — elle ne remplace pas un calcul officiel de bulletin de salaire.</p>
      </div>
    `;
    document.getElementById('e-month').addEventListener('change', (e)=>{ state.estimMonth=e.target.value; renderEstimation(); });
    document.getElementById('e-share').addEventListener('click', ()=>{
      let texte = `ESTIMATION — ${monthLabel(state.estimMonth)}\n\n`;
      calc.forEach(c => {
        texte += `${c.fiche.prenom} ${c.fiche.nomEnfant||''} — ${c.totalHeures.toFixed(2)} h — Salaire: ${money(c.salaire)} — Entretien: ${money(c.entretienTotal)} — Repas: ${money(c.repasTotal)}`;
        if(c.nbAbsences) texte += ` — Absences: ${c.nbAbsences}${c.absencesPayees ? ' (' + money(c.absencesPayees) + ' payée)' : ''}`;
        texte += ` — TOTAL: ${money(c.total)}\n`;
      });
      texte += `\nTOTAL GLOBAL : ${money(grandTotal)}\n`;
      if(navigator.share){
        navigator.share({title:"Estimation Nounou Manager", text:texte}).catch(()=>{});
      } else {
        navigator.clipboard.writeText(texte).then(()=>toast("Résumé copié dans le presse-papiers"))
          .catch(()=>{
            const blob = new Blob([texte], {type:'text/plain'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `estimation-${state.estimMonth}.txt`;
            a.click();
          });
      }
    });
  }

  // ---------- SAUVEGARDE ----------
  function renderSauvegarde(){
    headerSub.textContent = "Sauvegarde et restauration";
    app.innerHTML = `
      <div class="card">
        <h2>Exporter toutes les données</h2>
        <p class="hint">Télécharge une copie complète (fiches + journées + absences) à garder en sécurité, par exemple sur ton Drive.</p>
        <div class="btn-row">
          <button class="btn-primary" id="s-export">Télécharger la sauvegarde</button>
        </div>
      </div>
      <div class="card">
        <h2>Restaurer une sauvegarde</h2>
        <p class="hint">Remplace toutes les données actuelles par celles du fichier choisi. Une sauvegarde de sécurité est téléchargée automatiquement avant.</p>
        <input type="file" id="s-import" accept="application/json">
      </div>
      <div class="card">
        <h2>Réinitialiser</h2>
        <p class="hint">Supprime toutes les fiches, journées et absences de cet appareil. Irréversible.</p>
        <div class="btn-row">
          <button class="btn-danger" id="s-reset">Tout effacer</button>
        </div>
      </div>
    `;
    document.getElementById('s-export').addEventListener('click', ()=>exportData(false));
    document.getElementById('s-import').addEventListener('change', importData);
    document.getElementById('s-reset').addEventListener('click', ()=>{
      if(confirm("Supprimer définitivement toutes les fiches, journées et absences ?")){
        exportData(true);
        state.fiches = []; state.heures = []; state.absences = [];
        saveJSON(STORAGE_FICHES, []); saveJSON(STORAGE_HEURES, []); saveJSON(STORAGE_ABSENCES, []);
        toast("Données effacées");
        renderSauvegarde();
      }
    });
  }

  function exportData(silent){
    const data = {version:2, exportedAt: new Date().toISOString(), fiches: state.fiches, heures: state.heures, absences: state.absences};
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `nounou-manager-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    if(!silent) toast("Sauvegarde téléchargée");
  }

  function importData(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if(!Array.isArray(data.fiches) || !Array.isArray(data.heures)) throw new Error("format invalide");
        exportData(true);
        state.fiches = data.fiches;
        state.heures = data.heures;
        state.absences = Array.isArray(data.absences) ? data.absences : [];
        saveJSON(STORAGE_FICHES, state.fiches);
        saveJSON(STORAGE_HEURES, state.heures);
        saveJSON(STORAGE_ABSENCES, state.absences);
        state.selectedFicheId = state.fiches[0]?.id || null;
        toast("Données restaurées");
        renderSauvegarde();
      } catch(err){
        toast("Fichier invalide, restauration annulée");
      }
    };
    reader.readAsText(file);
  }

  // init
  document.querySelector('[data-tab="fiches"]').classList.add('active');
  render();

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
