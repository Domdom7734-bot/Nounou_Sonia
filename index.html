 <!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nounou Sonia Manager</title>
<meta name="theme-color" content="#3D6B7A">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F5F1;
    --ink:#2A3B42;
    --ink-soft:#5C6B70;
    --primary:#3D6B7A;
    --primary-dark:#2A4D58;
    --accent:#D9A441;
    --card:#FFFFFF;
    --border:#E4E0D8;
    --danger:#B5504B;
    --success:#4C7A5E;
    --absence:#8A6A1F;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    font-size:16px;
    line-height:1.4;
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
    padding-top:env(safe-area-inset-top);
    min-height:100vh;
  }
  h1,h2,h3{font-family:'Quicksand',-apple-system,sans-serif;font-weight:700;margin:0 0 4px;}
  header.top{
    padding:18px 20px 14px;
    background:var(--primary);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  header.top h1{font-size:1.15rem;color:#fff;margin:0;}
  header.top .sub{font-size:0.78rem;color:#DCEAEE;margin-top:2px;}
  main{padding:16px;max-width:640px;margin:0 auto;}
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:16px;
    margin-bottom:14px;
  }
  .card h2{font-size:1.05rem;color:var(--primary-dark);}
  label{
    display:block;
    font-size:0.82rem;
    color:var(--ink-soft);
    margin:10px 0 4px;
    font-weight:600;
  }
  input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],input[type=email],input[type=month],textarea,select{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:10px;
    font-size:1rem;
    background:#FCFBF9;
    color:var(--ink);
    font-family:inherit;
  }
  input:focus,textarea:focus,select:focus{
    outline:2px solid var(--primary);
    outline-offset:1px;
  }
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  button{
    font-family:inherit;
    font-size:0.95rem;
    font-weight:600;
    border:none;
    border-radius:10px;
    padding:11px 16px;
    cursor:pointer;
  }
  .btn-primary{background:var(--primary);color:#fff;}
  .btn-primary:active{background:var(--primary-dark);}
  .btn-accent{background:var(--accent);color:var(--ink);}
  .btn-outline{background:transparent;color:var(--primary);border:1.5px solid var(--primary);}
  .btn-danger{background:transparent;color:var(--danger);border:1.5px solid var(--danger);}
  .btn-ghost{background:transparent;color:var(--ink-soft);padding:8px 10px;}
  .btn-row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .mini-btn{padding:7px 12px;font-size:0.8rem;}
  .fiche-item{
    display:flex;
    align-items:center;
    gap:12px;
    padding:12px 4px;
    border-bottom:1px solid var(--border);
  }
  .fiche-item:last-child{border-bottom:none;}
  .dot{
    width:14px;height:14px;border-radius:50%;flex-shrink:0;
  }
  .fiche-info{flex:1;min-width:0;}
  .fiche-info .name{font-weight:700;}
  .fiche-info .meta{font-size:0.8rem;color:var(--ink-soft);}
  .icon-btn{
    background:transparent;border:none;color:var(--ink-soft);
    font-size:1.1rem;padding:6px;
  }
  .heure-item{
    display:flex;justify-content:space-between;align-items:center;
    padding:10px 4px;border-bottom:1px solid var(--border);
    font-size:0.92rem;
  }
  .heure-item:last-child{border-bottom:none;}
  .heure-item .dur{color:var(--absence);font-weight:700;white-space:nowrap;}
  .heure-item .comment{display:block;font-size:0.78rem;font-style:italic;color:var(--ink-soft);margin-top:2px;}
  .empty{
    text-align:center;color:var(--ink-soft);padding:24px 10px;font-size:0.92rem;
  }
  .total-line{
    display:flex;justify-content:space-between;padding:6px 0;font-size:0.95rem;
  }
  .total-line.grand{
    border-top:2px solid var(--border);margin-top:8px;padding-top:12px;
    font-weight:700;font-size:1.1rem;color:var(--primary-dark);
  }
  nav.tabs{
    position:fixed;bottom:0;left:0;right:0;
    background:var(--card);
    border-top:1px solid var(--border);
    display:flex;
    padding-bottom:env(safe-area-inset-bottom);
    z-index:10;
  }
  nav.tabs button{
    flex:1;background:none;border:none;border-radius:0;
    padding:10px 4px 8px;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    color:var(--ink-soft);font-size:0.68rem;font-weight:600;
  }
  nav.tabs button.active{color:var(--primary);}
  nav.tabs button svg{width:22px;height:22px;}
  .toast{
    position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));left:50%;
    transform:translateX(-50%);
    background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:20px;font-size:0.88rem;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;
  }
  .toast.show{opacity:1;}
  .badge{
    display:inline-block;background:#EFE6D0;color:#8A6A1F;
    font-size:0.72rem;font-weight:700;padding:2px 8px;border-radius:8px;
  }
  .day-badge{
    display:inline-block;background:#EAF1F2;color:var(--primary-dark);
    font-size:0.7rem;font-weight:700;padding:2px 7px;border-radius:6px;margin-right:3px;
  }
  select.fiche-select{margin-bottom:14px;}
  .hint{font-size:0.78rem;color:var(--ink-soft);margin-top:4px;}
  a.link-btn{color:var(--primary);font-weight:600;text-decoration:none;}
  .segmented{display:flex;border:1.5px solid var(--primary);border-radius:10px;overflow:hidden;margin-top:6px;}
  .segmented button{flex:1;border-radius:0;background:#fff;color:var(--primary);padding:9px;font-size:0.85rem;}
  .segmented button.active{background:var(--primary);color:#fff;}
  .weekdays{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;}
  .wd-btn{flex:1;min-width:38px;padding:8px 0;border:1.5px solid var(--primary);border-radius:8px;background:#fff;color:var(--primary);font-size:0.78rem;font-weight:700;}
  .wd-btn.active{background:var(--primary);color:#fff;}
  .child-summary{border-bottom:1px solid var(--border);padding:12px 0;}
  .child-summary:last-child{border-bottom:none;}
  .child-summary .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
  .child-summary .head .nm{font-weight:700;color:var(--primary-dark);}
  .child-summary .head .tt{font-weight:700;}
  .child-summary .sub{font-size:0.82rem;color:var(--ink-soft);}
  .preview-box{
    background:#F0EDE6;border:1px dashed var(--border);border-radius:10px;
    padding:12px;margin-top:12px;font-size:0.85rem;
  }
  .preview-box .big{font-size:1.15rem;font-weight:700;color:var(--primary-dark);}
  .readonly-card{margin-bottom:14px;}
  .readonly-card h3{color:var(--primary-dark);font-size:1rem;margin-bottom:8px;}
  .readonly-line{display:flex;justify-content:space-between;font-size:0.88rem;padding:4px 0;}
  .readonly-line span:first-child{color:var(--ink-soft);}
</style>
</head>
<body>

<header class="top">
  <div>
    <h1>Nounou Sonia Manager</h1>
    <div class="sub" id="headerSub">Gestion simple des heures et du salaire</div>
  </div>
</header>

<main id="app"></main>

<div class="toast" id="toast"></div>

<nav class="tabs">
  <button data-tab="fiches" class="tab-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/></svg>
    Fiches
  </button>
  <button data-tab="heures" class="tab-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
    Journées
  </button>
  <button data-tab="estimation" class="tab-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>
    Estimation
  </button>
  <button data-tab="parametres" class="tab-btn">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    Paramètres
  </button>
</nav>

<script>
(function(){
  "use strict";

  const STORAGE_FICHES = "nounou_fiches_v3";
  const STORAGE_ABSENCES = "nounou_absences_v3";
  const COLORS = ["#3D6B7A","#D9A441","#B5504B","#4C7A5E","#7A5C8A","#C97B5A"];
  const TYPES_ABSENCE = ["Absence maladie enfant","Absence maladie nounou","Absence convenance parents","Enfant récupéré plus tôt"];
  const JOURS_LABELS = ["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];

  function loadJSON(key){ try { return JSON.parse(localStorage.getItem(key)) || []; } catch(e){ return []; } }
  function saveJSON(key, list){ localStorage.setItem(key, JSON.stringify(list)); }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(s){ return (s||"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  function money(n){ return (Math.round((n||0)*100)/100).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + " €"; }
  function toast(msg){
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(()=>t.classList.remove('show'), 2400);
  }
  function timeToMinutes(t){
    if(!t) return null;
    const parts = t.split(':').map(Number);
    return parts[0]*60+parts[1];
  }
  function computeDurationHours(debut, fin){
    let d = timeToMinutes(debut), f = timeToMinutes(fin);
    if(d===null||f===null) return 0;
    let diff = f - d;
    if(diff < 0) diff += 24*60;
    return diff/60;
  }
  function fmtDate(d){
    return new Date(d+'T00:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'2-digit',month:'2-digit'});
  }
  function currentYm(){
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0');
  }

  function ficheDerived(f){
    const heuresParJour = computeDurationHours(f.heureArrivee, f.heureDepart);
    const joursParSemaine = (f.joursSemaine || []).filter(Boolean).length;
    const semaines = parseFloat(f.semainesAccueil) || 0;
    const heuresParAn = heuresParJour * joursParSemaine * semaines;
    const joursParAn = joursParSemaine * semaines;
    const salaireMensuel = (heuresParAn/12) * (parseFloat(f.taux)||0);
    const entretienMensuel = (joursParAn/12) * (parseFloat(f.entretien)||0);
    const repasMensuel = (joursParAn/12) * (parseFloat(f.repas)||0);
    const totalMensuel = salaireMensuel + entretienMensuel + repasMensuel;
    const complet = heuresParJour>0 && joursParSemaine>0 && semaines>0 && (parseFloat(f.taux)||0)>0;
    return {heuresParJour, joursParSemaine, semaines, heuresParAn, joursParAn, salaireMensuel, entretienMensuel, repasMensuel, totalMensuel, complet};
  }

  function moisActifsDansAnnee(dateDebutContrat, year){
    const now = new Date();
    const debut = dateDebutContrat ? new Date(dateDebutContrat+'T00:00:00') : new Date(year,0,1);
    if(debut.getFullYear() > year) return 0;
    let startMonth = (debut.getFullYear() === year) ? (debut.getMonth()+1) : 1;
    let endMonth = 12;
    if(year === now.getFullYear()) endMonth = now.getMonth()+1;
    else if(year > now.getFullYear()) return 0;
    return Math.max(0, Math.min(12, endMonth - startMonth + 1));
  }

  function ficheAnnuel(f, year){
    const d = ficheDerived(f);
    const mois = moisActifsDansAnnee(f.dateDebutContrat, year);
    return {
      mois,
      salaireAnnuel: d.salaireMensuel * mois,
      entretienAnnuel: d.entretienMensuel * mois,
      repasAnnuel: d.repasMensuel * mois,
      totalAnnuel: d.totalMensuel * mois
    };
  }

  function migrateFromV2(){
    const oldFichesRaw = localStorage.getItem('nounou_fiches_v2');
    const newFichesRaw = localStorage.getItem(STORAGE_FICHES);
    if(!oldFichesRaw || newFichesRaw) return; // rien à migrer, ou déjà fait
    try {
      const oldFiches = JSON.parse(oldFichesRaw) || [];
      const oldAbsences = JSON.parse(localStorage.getItem('nounou_absences_v2') || '[]') || [];
      const migratedFiches = oldFiches.map(f => ({
        id: f.id,
        prenom: f.prenom || '',
        nomEnfant: f.nomEnfant || '',
        dateNaissance: f.dateNaissance || '',
        prenomPapa: '',
        telephonePapa: f.telephoneParent || '',
        prenomMaman: '',
        telephoneMaman: '',
        dateDebutContrat: '',
        heureArrivee: '',
        heureDepart: '',
        joursSemaine: [true,true,true,true,true,false,false],
        semainesAccueil: '',
        taux: f.taux || 0,
        entretien: f.entretien || 0,
        repas: f.repas || 0,
      }));
      const migratedAbsences = oldAbsences.map(a => ({
        id: a.id, ficheId: a.ficheId, date: a.date, type: a.type || 'Autre', commentaire: a.commentaire || ''
      }));
      saveJSON(STORAGE_FICHES, migratedFiches);
      saveJSON(STORAGE_ABSENCES, migratedAbsences);
      window._migrationNotice = true;
    } catch(e){ /* migration best-effort, on ignore si ça échoue */ }
  }
  migrateFromV2();

  let state = {
    tab: 'fiches',
    fiches: loadJSON(STORAGE_FICHES),
    absences: loadJSON(STORAGE_ABSENCES),
    selectedFicheId: null,
    editingFicheId: null,
    absMonth: currentYm(),
    estimVue: 'mensuel',
    estimYear: new Date().getFullYear(),
  };

  if(state.fiches.length && !state.selectedFicheId){
    state.selectedFicheId = state.fiches[0].id;
  }

  const app = document.getElementById('app');
  const headerSub = document.getElementById('headerSub');

  function setTab(tab){
    state.tab = tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab===tab));
    render();
  }
  document.querySelectorAll('.tab-btn').forEach(b => b.addEventListener('click', ()=>setTab(b.dataset.tab)));

  function render(){
    if(state.tab==='fiches') return renderFichesReadonly();
    if(state.tab==='heures') return renderJournees();
    if(state.tab==='estimation') return renderEstimation();
    if(state.tab==='parametres') return renderParametres();
  }

  function renderFichesReadonly(){
    headerSub.textContent = "Fiches enfants";
    if(!state.fiches.length){
      app.innerHTML = '<div class="card"><div class="empty">Aucune fiche. Crée-en une dans l onglet Paramètres.</div></div>';
      return;
    }
    app.innerHTML = state.fiches.map((f,i) => {
      const d = ficheDerived(f);
      const joursHtml = JOURS_LABELS.map((lab,idx) => (f.joursSemaine||[])[idx] ? `<span class="day-badge">${lab}</span>` : '').join('');
      return `
      <div class="card readonly-card">
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;">
          <div class="dot" style="background:${COLORS[i % COLORS.length]}"></div>
          <h3 style="margin:0;">${escapeHtml(f.prenom)} ${escapeHtml(f.nomEnfant||'')}</h3>
        </div>
        <div class="readonly-line"><span>Date de naissance</span><span>${f.dateNaissance ? new Date(f.dateNaissance+'T00:00:00').toLocaleDateString('fr-FR') : '—'}</span></div>
        <div class="readonly-line"><span>Papa</span><span>${escapeHtml(f.prenomPapa||'—')} ${f.telephonePapa ? '· '+escapeHtml(f.telephonePapa) : ''}</span></div>
        <div class="readonly-line"><span>Maman</span><span>${escapeHtml(f.prenomMaman||'—')} ${f.telephoneMaman ? '· '+escapeHtml(f.telephoneMaman) : ''}</span></div>
        <div class="readonly-line"><span>Horaires habituels</span><span>${f.heureArrivee&&f.heureDepart ? f.heureArrivee+' → '+f.heureDepart : '—'}</span></div>
        <div style="margin-top:6px;">${joursHtml || '<span class="hint">Jours non renseignés</span>'}</div>
        ${d.complet ? `<div class="preview-box"><div class="big">${money(d.totalMensuel)} / mois</div><div class="hint">Mensualité calculée à partir du contrat (modifiable dans Paramètres)</div></div>` : '<p class="hint">Contrat incomplet — complète les horaires, jours et taux dans Paramètres pour voir la mensualité.</p>'}
      </div>`;
    }).join('');
  }

  function renderJournees(){
    headerSub.textContent = "Journal des exceptions";
    if(!state.fiches.length){
      app.innerHTML = '<div class="card"><div class="empty">Crée d abord une fiche dans Paramètres.</div></div>';
      return;
    }
    if(!state.selectedFicheId) state.selectedFicheId = state.fiches[0].id;
    const entries = state.absences
      .filter(a => a.ficheId===state.selectedFicheId && a.date.startsWith(state.absMonth))
      .sort((a,b)=>a.date.localeCompare(b.date));

    app.innerHTML = `
      <div class="card">
        <label for="a-fiche">Enfant</label>
        <select id="a-fiche" class="fiche-select">
          ${state.fiches.map(f=>`<option value="${f.id}" ${f.id===state.selectedFicheId?'selected':''}>${escapeHtml(f.prenom)}</option>`).join('')}
        </select>
        <h2>Ajouter une exception</h2>
        <label for="a-date">Date</label>
        <input type="date" id="a-date" value="${new Date().toISOString().slice(0,10)}">
        <label for="a-type">Type</label>
        <select id="a-type">
          ${TYPES_ABSENCE.map(t=>`<option value="${t}">${t}</option>`).join('')}
        </select>
        <label for="a-comment">Commentaire (optionnel)</label>
        <input type="text" id="a-comment" placeholder="Précision libre">
        <p class="hint">Le salaire étant mensualisé, ces événements sont enregistrés à titre de journal — ils ne modifient pas le montant mensuel.</p>
        <div class="btn-row">
          <button class="btn-primary" id="a-save">Ajouter</button>
        </div>
      </div>
      <div class="card">
        <label for="a-month">Mois affiché</label>
        <input type="month" id="a-month" value="${state.absMonth}">
        <div style="margin-top:10px;">
          ${entries.length ? entries.map(e => `
            <div class="heure-item">
              <div>${fmtDate(e.date)} — ${escapeHtml(e.type)}
                ${e.commentaire ? `<span class="comment">${escapeHtml(e.commentaire)}</span>` : ''}
              </div>
              <div><button class="icon-btn" data-dela="${e.id}" aria-label="Supprimer">🗑</button></div>
            </div>
          `).join('') : '<div class="empty">Aucune exception ce mois-ci pour cet enfant.</div>'}
        </div>
      </div>
    `;
    document.getElementById('a-fiche').addEventListener('change', (e)=>{ state.selectedFicheId=e.target.value; renderJournees(); });
    document.getElementById('a-month').addEventListener('change', (e)=>{ state.absMonth=e.target.value; renderJournees(); });
    document.getElementById('a-save').addEventListener('click', ()=>{
      const date = document.getElementById('a-date').value;
      const type = document.getElementById('a-type').value;
      const commentaire = document.getElementById('a-comment').value.trim();
      if(!date){ toast("La date est obligatoire"); return; }
      state.absences.push({id: uid(), ficheId: state.selectedFicheId, date, type, commentaire});
      saveJSON(STORAGE_ABSENCES, state.absences);
      toast("Exception enregistrée");
      renderJournees();
    });
    document.querySelectorAll('[data-dela]').forEach(b=>b.addEventListener('click', ()=>{
      state.absences = state.absences.filter(a=>a.id!==b.dataset.dela);
      saveJSON(STORAGE_ABSENCES, state.absences);
      renderJournees();
    }));
  }

  function renderEstimation(){
    headerSub.textContent = "Estimation — mensualisation";
    if(!state.fiches.length){
      app.innerHTML = '<div class="card"><div class="empty">Crée d abord une fiche dans Paramètres.</div></div>';
      return;
    }
    const isMensuel = state.estimVue === 'mensuel';
    app.innerHTML = `
      <div class="card">
        <div class="segmented">
          <button type="button" data-vue="mensuel" class="${isMensuel?'active':''}">Vue mensuelle</button>
          <button type="button" data-vue="annuel" class="${!isMensuel?'active':''}">Vue annuelle</button>
        </div>
        ${!isMensuel ? `
          <label for="es-year">Année</label>
          <select id="es-year">
            ${[state.estimYear-2,state.estimYear-1,state.estimYear,state.estimYear+1].map(y=>`<option value="${y}" ${y===state.estimYear?'selected':''}>${y}</option>`).join('')}
          </select>
        ` : ''}
      </div>
      <div class="card" id="estim-body"></div>
    `;
    document.querySelectorAll('[data-vue]').forEach(b=>b.addEventListener('click', ()=>{ state.estimVue=b.dataset.vue; renderEstimation(); }));
    const yearSel = document.getElementById('es-year');
    if(yearSel) yearSel.addEventListener('change', (e)=>{ state.estimYear = parseInt(e.target.value,10); renderEstimation(); });

    const body = document.getElementById('estim-body');
    if(isMensuel){
      const calc = state.fiches.map(f => Object.assign({fiche:f}, ficheDerived(f)));
      const grandTotal = calc.reduce((s,c)=>s+c.totalMensuel,0);
      body.innerHTML = `
        <h2>Mensualité (chaque mois)</h2>
        ${calc.map(c => `
          <div class="child-summary">
            <div class="head">
              <span class="nm">${escapeHtml(c.fiche.prenom)} ${escapeHtml(c.fiche.nomEnfant||'')}</span>
              <span class="tt">${c.complet ? money(c.totalMensuel) : '—'}</span>
            </div>
            <div class="sub">${c.complet ? `salaire ${money(c.salaireMensuel)} · entretien ${money(c.entretienMensuel)} · repas ${money(c.repasMensuel)}` : 'Contrat incomplet — à finaliser dans Paramètres'}</div>
            <div class="btn-row" style="margin-top:8px;">
              <button class="btn-outline mini-btn" data-share-mensuel="${c.fiche.id}">Partager à cette famille</button>
            </div>
          </div>
        `).join('')}
        <div class="total-line grand"><span>TOTAL GLOBAL / mois</span><span>${money(grandTotal)}</span></div>
        <p class="hint">Le montant mensuel est fixe (mensualisation) : il ne varie pas selon les jours réellement travaillés dans le mois.</p>
      `;
      document.querySelectorAll('[data-share-mensuel]').forEach(b => b.addEventListener('click', ()=>{
        const c = calc.find(x => x.fiche.id === b.dataset.shareMensuel);
        if(!c) return;
        const texte = `Mensualité — ${c.fiche.prenom} ${c.fiche.nomEnfant||''}\n\nSalaire : ${money(c.salaireMensuel)}\nIndemnité entretien : ${money(c.entretienMensuel)}\nFrais de repas : ${money(c.repasMensuel)}\nTOTAL MENSUEL : ${money(c.totalMensuel)}\n`;
        shareOrCopy(texte, `mensualite-${c.fiche.prenom}.txt`);
      }));
    } else {
      const calc = state.fiches.map(f => Object.assign({fiche:f}, ficheAnnuel(f, state.estimYear)));
      const grandTotal = calc.reduce((s,c)=>s+c.totalAnnuel,0);
      body.innerHTML = `
        <h2><span class="badge">${state.estimYear}</span> Revenus perçus dans l année</h2>
        ${calc.map(c => `
          <div class="child-summary">
            <div class="head">
              <span class="nm">${escapeHtml(c.fiche.prenom)} ${escapeHtml(c.fiche.nomEnfant||'')}</span>
              <span class="tt">${money(c.totalAnnuel)}</span>
            </div>
            <div class="sub">${c.mois} mois actifs sur l année · salaire ${money(c.salaireAnnuel)} · entretien ${money(c.entretienAnnuel)} · repas ${money(c.repasAnnuel)}</div>
            <div class="btn-row" style="margin-top:8px;">
              <button class="btn-outline mini-btn" data-share-annuel="${c.fiche.id}">Partager / copier ce total</button>
            </div>
          </div>
        `).join('')}
        <div class="total-line grand"><span>TOTAL GLOBAL ${state.estimYear}</span><span>${money(grandTotal)}</span></div>
        <p class="hint">C est le montant Revenus perçus dans l année à reporter par enfant pour ta déclaration — l abattement fiscal reste à calculer de ton côté.</p>
      `;
      document.querySelectorAll('[data-share-annuel]').forEach(b => b.addEventListener('click', ()=>{
        const c = calc.find(x => x.fiche.id === b.dataset.shareAnnuel);
        if(!c) return;
        const texte = `Revenus perçus ${state.estimYear} — ${c.fiche.prenom} ${c.fiche.nomEnfant||''}\n\nSalaire : ${money(c.salaireAnnuel)}\nIndemnité entretien : ${money(c.entretienAnnuel)}\nFrais de repas : ${money(c.repasAnnuel)}\nTOTAL REVENUS PERÇUS : ${money(c.totalAnnuel)}\n`;
        shareOrCopy(texte, `revenus-${c.fiche.prenom}-${state.estimYear}.txt`);
      }));
    }
  }

  function shareOrCopy(texte, filename){
    if(navigator.share){
      navigator.share({title:"Nounou Sonia Manager", text:texte}).catch(()=>{});
    } else {
      navigator.clipboard.writeText(texte).then(()=>toast("Copié dans le presse-papiers"))
        .catch(()=>{
          const blob = new Blob([texte], {type:'text/plain'});
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = filename;
          a.click();
        });
    }
  }

  function renderParametres(){
    headerSub.textContent = "Paramètres";
    const editing = state.fiches.find(f => f.id === state.editingFicheId);
    const jours = editing ? (editing.joursSemaine || [true,true,true,true,true,false,false]) : [true,true,true,true,true,false,false];

    app.innerHTML = `
      <div class="card">
        <h2>${editing ? "Modifier la fiche" : "Nouvelle fiche"}</h2>
        <div class="row">
          <div>
            <label for="f-prenom">Prénom de l enfant</label>
            <input type="text" id="f-prenom" value="${editing ? escapeHtml(editing.prenom) : ''}" placeholder="Léo">
          </div>
          <div>
            <label for="f-nomEnfant">Nom de l enfant</label>
            <input type="text" id="f-nomEnfant" value="${editing ? escapeHtml(editing.nomEnfant||'') : ''}" placeholder="Dupont">
          </div>
        </div>
        <label for="f-naissance">Date de naissance</label>
        <input type="date" id="f-naissance" value="${editing ? (editing.dateNaissance||'') : ''}">

        <div class="row">
          <div>
            <label for="f-prenomPapa">Prénom du papa</label>
            <input type="text" id="f-prenomPapa" value="${editing ? escapeHtml(editing.prenomPapa||'') : ''}" placeholder="Marc">
          </div>
          <div>
            <label for="f-telPapa">Téléphone papa</label>
            <input type="tel" id="f-telPapa" value="${editing ? escapeHtml(editing.telephonePapa||'') : ''}" placeholder="06 12 34 56 78">
          </div>
        </div>
        <div class="row">
          <div>
            <label for="f-prenomMaman">Prénom de la maman</label>
            <input type="text" id="f-prenomMaman" value="${editing ? escapeHtml(editing.prenomMaman||'') : ''}" placeholder="Julie">
          </div>
          <div>
            <label for="f-telMaman">Téléphone maman</label>
            <input type="tel" id="f-telMaman" value="${editing ? escapeHtml(editing.telephoneMaman||'') : ''}" placeholder="06 98 76 54 32">
          </div>
        </div>

        <label for="f-debutContrat">Date de début du contrat</label>
        <input type="date" id="f-debutContrat" value="${editing ? (editing.dateDebutContrat||'') : ''}">
        <p class="hint">Sert à calculer correctement le total de la première année si le contrat n a pas démarré en janvier.</p>

        <div class="row">
          <div>
            <label for="f-arrivee">Heure d arrivée habituelle</label>
            <input type="time" id="f-arrivee" value="${editing ? (editing.heureArrivee||'') : '08:00'}">
          </div>
          <div>
            <label for="f-depart">Heure de départ habituelle</label>
            <input type="time" id="f-depart" value="${editing ? (editing.heureDepart||'') : '18:00'}">
          </div>
        </div>
        <label>Jours d accueil dans la semaine</label>
        <div class="weekdays" id="f-jours">
          ${JOURS_LABELS.map((lab,idx)=>`<button type="button" class="wd-btn ${jours[idx]?'active':''}" data-wd="${idx}">${lab}</button>`).join('')}
        </div>
        <label for="f-semaines">Semaines d accueil prévues dans l année</label>
        <input type="number" step="0.5" min="0" max="52" id="f-semaines" value="${editing ? editing.semainesAccueil : ''}" placeholder="Ex : 45">

        <div class="row">
          <div>
            <label for="f-taux">Taux horaire net (€)</label>
            <input type="number" step="0.01" min="0" id="f-taux" value="${editing ? editing.taux : ''}" placeholder="4.50">
          </div>
          <div>
            <label for="f-entretien">Indemnité entretien / jour (€)</label>
            <input type="number" step="0.01" min="0" id="f-entretien" value="${editing ? editing.entretien : ''}" placeholder="3.50">
          </div>
        </div>
        <label for="f-repas">Frais de repas / jour (€)</label>
        <input type="number" step="0.01" min="0" id="f-repas" value="${editing ? editing.repas : ''}" placeholder="4.00">

        <div class="preview-box" id="f-preview">Renseigne les horaires, jours, semaines et taux pour voir la mensualité calculée ici.</div>

        <div class="btn-row">
          <button class="btn-primary" id="f-save">${editing ? "Enregistrer" : "Ajouter la fiche"}</button>
          ${editing ? '<button class="btn-ghost" id="f-cancel">Annuler</button>' : ''}
        </div>
      </div>
      <div class="card">
        <h2>Fiches existantes</h2>
        <div id="fiches-list">
          ${state.fiches.length ? state.fiches.map((f,i) => `
            <div class="fiche-item">
              <div class="dot" style="background:${COLORS[i % COLORS.length]}"></div>
              <div class="fiche-info">
                <div class="name">${escapeHtml(f.prenom)} ${escapeHtml(f.nomEnfant||'')}</div>
                <div class="meta">${f.taux || '—'} €/h</div>
              </div>
              <button class="icon-btn" data-edit="${f.id}" aria-label="Modifier">✎</button>
              <button class="icon-btn" data-del="${f.id}" aria-label="Supprimer">🗑</button>
            </div>
          `).join('') : '<div class="empty">Aucune fiche pour l instant.</div>'}
        </div>
      </div>
      <div class="card">
        <h2>Exporter toutes les données</h2>
        <p class="hint">Télécharge une copie complète (fiches + journal d exceptions) à garder en sécurité.</p>
        <div class="btn-row">
          <button class="btn-primary" id="s-export">Télécharger la sauvegarde</button>
        </div>
      </div>
      <div class="card">
        <h2>Restaurer une sauvegarde</h2>
        <p class="hint">Remplace toutes les données actuelles par celles du fichier choisi. Une sauvegarde de sécurité est téléchargée automatiquement avant.</p>
        <input type="file" id="s-import" accept="application/json">
      </div>
      <div class="card">
        <h2>Réinitialiser</h2>
        <p class="hint">Supprime toutes les fiches et le journal d exceptions de cet appareil. Irréversible.</p>
        <div class="btn-row">
          <button class="btn-danger" id="s-reset">Tout effacer</button>
        </div>
      </div>
    `;

    function readFormValues(){
      const j = [];
      document.querySelectorAll('#f-jours .wd-btn').forEach(b => j[parseInt(b.dataset.wd,10)] = b.classList.contains('active'));
      return {
        heureArrivee: document.getElementById('f-arrivee').value,
        heureDepart: document.getElementById('f-depart').value,
        joursSemaine: j,
        semainesAccueil: document.getElementById('f-semaines').value,
        taux: document.getElementById('f-taux').value,
        entretien: document.getElementById('f-entretien').value,
        repas: document.getElementById('f-repas').value,
      };
    }
    function updatePreview(){
      const d = ficheDerived(readFormValues());
      const box = document.getElementById('f-preview');
      if(d.complet){
        box.innerHTML = `<div class="big">${money(d.totalMensuel)} / mois</div><div class="hint">salaire ${money(d.salaireMensuel)} · entretien ${money(d.entretienMensuel)} · repas ${money(d.repasMensuel)} — soit ${d.heuresParAn.toFixed(1)} h/an réparties sur 12 mois</div>`;
      } else {
        box.textContent = "Renseigne les horaires, jours, semaines et taux pour voir la mensualité calculée ici.";
      }
    }
    document.querySelectorAll('#f-jours .wd-btn').forEach(b => b.addEventListener('click', ()=>{ b.classList.toggle('active'); updatePreview(); }));
    ['f-arrivee','f-depart','f-semaines','f-taux','f-entretien','f-repas'].forEach(id=>{
      document.getElementById(id).addEventListener('input', updatePreview);
    });
    updatePreview();

    document.getElementById('f-save').addEventListener('click', ()=>onSaveFiche(readFormValues));
    const cancelBtn = document.getElementById('f-cancel');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ state.editingFicheId=null; renderParametres(); });
    document.querySelectorAll('[data-edit]').forEach(b => b.addEventListener('click', ()=>{
      state.editingFicheId = b.dataset.edit; renderParametres();
    }));
    document.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', ()=>{
      if(confirm("Supprimer cette fiche et son journal d exceptions ?")){
        const id = b.dataset.del;
        state.fiches = state.fiches.filter(f=>f.id!==id);
        state.absences = state.absences.filter(a=>a.ficheId!==id);
        saveJSON(STORAGE_FICHES, state.fiches);
        saveJSON(STORAGE_ABSENCES, state.absences);
        if(state.selectedFicheId===id) state.selectedFicheId = state.fiches[0]?.id || null;
        toast("Fiche supprimée");
        renderParametres();
      }
    }));
    document.getElementById('s-export').addEventListener('click', ()=>exportData(false));
    document.getElementById('s-import').addEventListener('change', importData);
    document.getElementById('s-reset').addEventListener('click', ()=>{
      if(confirm("Supprimer définitivement toutes les fiches et le journal d exceptions ?")){
        exportData(true);
        state.fiches = []; state.absences = [];
        saveJSON(STORAGE_FICHES, []); saveJSON(STORAGE_ABSENCES, []);
        toast("Données effacées");
        renderParametres();
      }
    });
  }

  function onSaveFiche(readFormValues){
    const prenom = document.getElementById('f-prenom').value.trim();
    const nomEnfant = document.getElementById('f-nomEnfant').value.trim();
    const dateNaissance = document.getElementById('f-naissance').value;
    const prenomPapa = document.getElementById('f-prenomPapa').value.trim();
    const telephonePapa = document.getElementById('f-telPapa').value.trim();
    const prenomMaman = document.getElementById('f-prenomMaman').value.trim();
    const telephoneMaman = document.getElementById('f-telMaman').value.trim();
    const dateDebutContrat = document.getElementById('f-debutContrat').value;
    const contrat = readFormValues();
    const taux = parseFloat(contrat.taux);

    if(!prenom){ toast("Le prénom est obligatoire"); return; }
    if(isNaN(taux) || taux <= 0){ toast("Indique un taux horaire valide"); return; }

    const payload = Object.assign({
      prenom: prenom, nomEnfant: nomEnfant, dateNaissance: dateNaissance,
      prenomPapa: prenomPapa, telephonePapa: telephonePapa,
      prenomMaman: prenomMaman, telephoneMaman: telephoneMaman,
      dateDebutContrat: dateDebutContrat
    }, contrat, {taux: taux});

    if(state.editingFicheId){
      const f = state.fiches.find(x=>x.id===state.editingFicheId);
      Object.assign(f, payload);
      state.editingFicheId = null;
      toast("Fiche mise à jour");
    } else {
      const f = Object.assign({id: uid()}, payload);
      state.fiches.push(f);
      state.selectedFicheId = f.id;
      toast("Fiche ajoutée");
    }
    saveJSON(STORAGE_FICHES, state.fiches);
    renderParametres();
  }

  function exportData(silent){
    const data = {version:3, exportedAt: new Date().toISOString(), fiches: state.fiches, absences: state.absences};
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `nounou-sonia-sauvegarde-${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    if(!silent) toast("Sauvegarde téléchargée");
  }

  function importData(e){
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if(!Array.isArray(data.fiches)) throw new Error("format invalide");
        exportData(true);
        state.fiches = data.fiches;
        state.absences = Array.isArray(data.absences) ? data.absences : [];
        saveJSON(STORAGE_FICHES, state.fiches);
        saveJSON(STORAGE_ABSENCES, state.absences);
        state.selectedFicheId = state.fiches[0]?.id || null;
        toast("Données restaurées");
        renderParametres();
      } catch(err){
        toast("Fichier invalide, restauration annulée");
      }
    };
    reader.readAsText(file);
  }

  document.querySelector('[data-tab="fiches"]').classList.add('active');
  render();
  if(window._migrationNotice){
    toast("Anciennes données récupérées — complète les contrats dans Paramètres");
  }

  if('serviceWorker' in navigator){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    });
  }
})();
</script>
</body>
</html>
